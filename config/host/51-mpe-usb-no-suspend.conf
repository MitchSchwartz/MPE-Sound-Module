# WirePlumber drop-in — install to ~/.config/wireplumber/wireplumber.conf.d/
#
# Optional WirePlumber drop-in for Linux hosts using PipeWire.
#
# Prevents WirePlumber from suspending the MPE gadget capture node between DAW
# sessions. Not required for plug-and-play DAW use — the Pi stall watchdog handles
# recovery when you arm a track. Install only if first-arm latency is noticeable.
#
# Pi-side recovery: scripts/uac2-stall-watchdog.sh

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-MPE_Sound_Module.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
