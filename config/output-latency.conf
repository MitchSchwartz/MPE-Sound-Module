# Analogue output latency BEYOND what JACK declares, in frames at 48 kHz.
#
# THE SINGLE SOURCE for the hardware term in the looper-grid MIDI offset.
#
# jackd runs with no -I/-O and both default to 0, so without this file every
# DAC's transfer and conversion time enters the offset as zero -- an unset
# parameter wearing the costume of a measurement.
#
# MEASURED 2026-09-02 with jack_iodelay over a physical loopback. Two readings,
# solved as a pair (docs/measurements/midi-audio-latency-phase2-2026-09-02.md):
#
#   KA1 out      -> Scarlett in : 163 frames  = KA1_DAC + Scarlett_ADC
#   Scarlett out -> Scarlett in : 197 frames  = Scarlett_DAC + Scarlett_ADC
#
# Subtracting gives KA1_DAC - Scarlett_DAC = -34 frames EXACTLY, with no
# assumption. Splitting the Scarlett's 197 evenly between its own converters --
# the convention jack_iodelay itself recommends with "use 98 for -I and -O" --
# then yields the absolutes below. A split anywhere from 40/60 to 60/40 puts the
# KA1 between 45 and 84 frames, so treat these as +/- 20 frames (0.4 ms). That
# residual is an order of magnitude smaller than the 4.65 ms error it corrects.
#
# Keyed by usb:VID:PID, the same identity scripts/lib/audio-outputs.sh derives.
# A device absent from this file contributes ZERO and is reported as unmeasured
# -- never silently guessed from a similar-looking one.
#
# key              frames  # device, provenance
usb:2972:0051      64      # FiiO KA1 (full speed) — measured 2026-09-02
usb:1235:8212      98      # Focusrite Scarlett 4i4 (high speed) — measured 2026-09-02
