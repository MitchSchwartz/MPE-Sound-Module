# MPE idle sink — the free-running clock the audio graph runs on when there is
# no external DAC and the tethered host is not capturing.
#
# snd-dummy, not snd-aloop. MEASURED on the appliance 2026-08-30:
#
#   jackd -d alsa -P hw:<Loopback> -p 64   ALSA: poll time out, polled for
#                                          3999042 usecs, max retry cnt = 5,
#                                          Exiting -- driver never runs
#   jackd -d alsa -P hw:<Dummy>    -p 64   driver runs, clients attach, still
#                                          serving at 16s
#
# snd-aloop is a pipe, not a clock: its playback side only advances while
# something reads the matching capture side. An `aplay` to it completes in
# real time, which looks exactly like a working clock and is not one.
# snd-dummy has its own hrtimer and needs no partner.
#
# index=8 keeps it clear of the real cards and of the calibration loopback
# (index=7), so hw: numbering stays stable as USB devices come and go.
options snd-dummy index=8 pcm_substreams=2
