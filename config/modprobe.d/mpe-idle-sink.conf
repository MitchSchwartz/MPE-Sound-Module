# The idle sink for the usb-host profile: a free-running local clock to run the
# audio graph on while the tethered host is not capturing.
#
# WHY THIS EXISTS. A UAC2 gadget has no clock of its own — under the USB Audio
# Class spec the HOST enables the streaming interface, and isochronous
# transfers only happen while it is active. Measured on the appliance
# 2026-08-30, with the host attached but not capturing:
#
#     aplay -D hw:<gadget>   -> write error: Input/output error, after 1s
#     aplay -D hw:<Loopback> -> 3s of audio took 3s, with nothing reading it
#
# So the graph cannot simply bind the gadget early and wait for the host. The
# standard arrangement is to run on a free-running local device and bridge into
# the gadget when the host appears; docs/USB-AUDIO-HOST.md gives the Pi 4
# answer for that device, "idle sink is Pi headphone". The Pi 5 has no
# headphone jack, and its HDMI ports read `disconnected` with no display — so
# on a Pi 5 with no external DAC there was no idle sink at all, and jackd could
# not start.
#
# index=7 keeps it out of the way of the real cards. It must never outrank a
# DAC: detect-audio-device.sh ranks it at tier 3, below every real interface.
options snd-aloop index=7 pcm_substreams=2
