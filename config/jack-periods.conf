# JACK server period sizes (frames) the appliance accepts.
#
# THE SINGLE SOURCE. Read by:
#   scripts/lib/audio-engine.sh   (mpe_jack_period_presets / validator)
#   scripts/set-surge-audio.sh    (via audio-engine.sh — no second case list)
#   patch_browser/surge_audio.py  (JACK_PERIOD_PRESETS)
#   mpe-cli commands/jack.sh      (sourced from the appliance, not mirrored)
#
# This file exists because the list had already diverged four ways by
# 2026-09-01: 96 and 192 were runnable on the appliance and unreachable from
# BOTH the touch UI and mpe-cli, and the UI separately offered 768 and 2048,
# which the validator rejects. A menu must not be able to offer a value the
# appliance refuses, and the appliance must not accept a value no one can pick.
#
# USB frame alignment at 48 kHz, for the full-speed (12 Mbps, 1 ms service
# interval = 48 frames) dongles: 48/96/192 are exact multiples; the powers of
# two are not (64 = 1.33 frames, 128 = 2.67, 256 = 5.33).
#
# One value per line. Blank lines and #-comments ignored. Order is the order
# the touch menu shows them.
32
48
64
96
128
192
256
512
1024
